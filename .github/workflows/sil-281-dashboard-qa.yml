name: SIL-281 Dashboard Browser QA

on:
  push:
    branches: [codex/sil-281-chromium-runner]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run development browser QA
        run: npx playwright test -c dashboard-qa.config.ts
      - name: Build production bundle with synthetic QA settings
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-qa-key
      - name: Run production browser QA
        run: npx playwright test -c dashboard-qa.config.ts
        env:
          DASHBOARD_QA_MODE: production
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-281-dashboard-browser-evidence
          path: test-results/dashboard-qa-*/
          if-no-files-found: error
          retention-days: 7
