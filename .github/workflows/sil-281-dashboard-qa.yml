name: SIL-325 upstream draft regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify draft patch
        run: echo '24a6bd309b211802aff14c3d438fb95145bf9dba092b39dc9b5b241a2aa74f04  .github/qa/sil325-draft.patch' | sha256sum -c
      - name: Prepare upstream source
        run: |
          git clone https://github.com/paperclipai/paperclip.git /tmp/paperclip-sil325
          cd /tmp/paperclip-sil325
          git checkout --detach 6400698a8ec5c50d2074746c97c6266d160ed5a5
          git apply --check "$GITHUB_WORKSPACE/.github/qa/sil325-draft.patch"
          git apply "$GITHUB_WORKSPACE/.github/qa/sil325-draft.patch"
          echo '8768af0770332df649bf17cecdddff625731ffbb7fb9f178bce896fe4c00f787  '"$GITHUB_WORKSPACE"'/.github/qa/sil325-delta.patch' | sha256sum -c
          git apply --check "$GITHUB_WORKSPACE/.github/qa/sil325-delta.patch"
          git apply "$GITHUB_WORKSPACE/.github/qa/sil325-delta.patch"
          node --version
          df -h .
      - name: Install dependencies
        working-directory: /tmp/paperclip-sil325
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
          pnpm install --frozen-lockfile
      - name: Build upstream plugin SDK
        working-directory: /tmp/paperclip-sil325
        run: pnpm --filter @paperclipai/plugin-sdk build
      - name: Run unexecuted draft regressions
        working-directory: /tmp/paperclip-sil325
        run: pnpm --dir server exec vitest run src/__tests__/checkout-run-source.test.ts
