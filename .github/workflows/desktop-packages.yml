name: Desktop packages

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/desktop-packages.yml'
      - 'desktop/**'
      - 'src-tauri/**'
      - 'scripts/package-desktop.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      signed_updates:
        description: Generate update artifacts with the release signing key
        type: boolean
        default: false
      platform_signing:
        description: Sign macOS and Windows packages for distribution
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            bundles: 'app dmg'
          - platform: macos-x64
            runner: macos-15-intel
            bundles: 'app dmg'
          - platform: windows-x64
            runner: windows-2025
            bundles: nsis
          - platform: linux-x64
            runner: ubuntu-24.04
            bundles: appimage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        run: rustup default stable

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libayatana-appindicator3-dev libfuse2t64 libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare macOS notarization
        if: runner.os == 'macOS' && inputs.platform_signing
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [[ -z "$APPLE_API_PRIVATE_KEY" ]]; then
            echo 'Set the App Store Connect notarization private key.'
            exit 1
          fi
          umask 077
          apple_key="$RUNNER_TEMP/lekhan-notarization.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$apple_key"
          openssl pkey -in "$apple_key" -noout
          printf 'APPLE_API_KEY_PATH=%s\n' "$apple_key" >> "$GITHUB_ENV"

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && inputs.platform_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Set the base64 code signing PFX and its password.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'lekhan-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certs = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object HasPrivateKey)
            if ($certs.Count -ne 1 -or $certs[0].Thumbprint -notmatch '^[0-9A-F]{40}$') {
              throw 'The PFX must provide one signing certificate with a private key.'
            }
            $config = @{
              bundle = @{ windows = @{
                certificateThumbprint = $certs[0].Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
                tsp = $true
              } }
            } | ConvertTo-Json -Depth 5 -Compress
            "LEKHAN_WINDOWS_SIGNING_CONFIG=$config" >> $env:GITHUB_ENV
            "LEKHAN_WINDOWS_SIGNER=$($certs[0].Thumbprint)" >> $env:GITHUB_ENV
          } finally {
            [IO.File]::Delete($pfx)
          }

      - name: Build desktop package
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          APPLE_CERTIFICATE: ${{ inputs.platform_signing && runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.platform_signing && runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.platform_signing && runner.os == 'macOS' && vars.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ inputs.platform_signing && runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ inputs.platform_signing && runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          LEKHAN_UPDATE_PUBLIC_KEY: ${{ inputs.signed_updates && vars.LEKHAN_UPDATE_PUBLIC_KEY || '' }}
          LEKHAN_UPDATE_MANIFEST_URL: ${{ inputs.signed_updates && vars.LEKHAN_UPDATE_MANIFEST_URL || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signed_updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signed_updates && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [[ '${{ inputs.signed_updates }}' == 'true' && ( -z "$LEKHAN_UPDATE_PUBLIC_KEY" || -z "$LEKHAN_UPDATE_MANIFEST_URL" || -z "$TAURI_SIGNING_PRIVATE_KEY" ) ]]; then
            echo "Set the updater public key, HTTPS manifest URL, and signing secret for a signed build."
            exit 1
          fi
          if [[ '${{ inputs.platform_signing }}' == 'true' && "$RUNNER_OS" == macOS ]] &&
            [[ "$APPLE_SIGNING_IDENTITY" != 'Developer ID Application: '* || -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_API_ISSUER" || -z "$APPLE_API_KEY" ]]; then
            echo 'Set the Developer ID Application identity, certificate, password, and notarization credentials.'
            exit 1
          fi
          if [[ '${{ inputs.platform_signing }}' != 'true' ]]; then
            # Tauri tries to import APPLE_CERTIFICATE whenever it is set, even if it is empty.
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY
          fi
          platform_config=()
          if [[ -n "$LEKHAN_WINDOWS_SIGNING_CONFIG" ]]; then
            platform_config=(--config "$LEKHAN_WINDOWS_SIGNING_CONFIG")
          fi
          npm run desktop:package -- --ci --bundles ${{ matrix.bundles }} "${platform_config[@]}"

      - name: Verify the notarized macOS app
        if: runner.os == 'macOS' && inputs.platform_signing
        shell: bash
        run: |
          app=src-tauri/target/release/bundle/macos/Lekhan.app
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute "$app"

      - name: Verify signed Windows installer
        if: runner.os == 'Windows' && inputs.platform_signing
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -File 'src-tauri/target/release/bundle/nsis/*.exe')
          if (!$installers.Count) { throw 'The NSIS installer was not produced.' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:LEKHAN_WINDOWS_SIGNER -or !$signature.TimeStamperCertificate) {
              throw "The installer has no valid timestamped release signature: $($installer.Name)"
            }
          }

      - name: Test desktop core
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: lekhan-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.sig
